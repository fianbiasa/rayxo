# rayxo: Apache behind Nginx for customer websites. setup.sh fills in
# the double-brace placeholders and enables this as conf "rayxo".
# Apache only listens on 127.0.0.1:8080 (ports.conf); Nginx in front owns
# ports 80 and 443, serves static files and passes the rest here.

ServerName {{HOSTNAME}}

# These replace Ubuntu's security.conf, which setup.sh disables because it
# loads after this file and would turn them back on.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# The visitor's real address, as Nginx passes it.
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 127.0.0.1 ::1

# Sites behind an HTTPS Nginx know they are on HTTPS (WordPress needs this).
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

# A customer's .htaccess must never set PHP settings through FastCGI. Even if
# a mod_rewrite "[E=...]" put PHP_VALUE or PHP_ADMIN_VALUE into the request
# environment, strip both before Apache forwards the request to any PHP-FPM
# pool, so open_basedir, auto_prepend_file and the rest stay exactly as the
# pool fixes them. Applied when the request is proxied, after .htaccess ran.
ProxyFCGISetEnvIf "true" !PHP_VALUE
ProxyFCGISetEnvIf "true" !PHP_ADMIN_VALUE

# Customer homes. Symlinks are only followed when the link and its target
# have the same owner, so nobody can link to another account's files.
<Directory /home>
    Options SymLinksIfOwnerMatch
    # A customer's .htaccess may use the directives real apps need (rewrites,
    # caching headers, content types, error pages, basic auth) but NOT ones
    # that route a request to another FastCGI pool or change PHP settings
    # (SetHandler, AddHandler, Action, SetEnv, ProxyFCGISetEnvIf): those let a
    # customer's .htaccess run code in the panel's or another account's pool.
    # So FileInfo is replaced by an explicit list of the safe directives.
    AllowOverride AuthConfig Indexes Limit Options=Indexes,MultiViews,SymLinksIfOwnerMatch
    AllowOverrideList RewriteEngine RewriteOptions RewriteBase RewriteCond RewriteRule Header RequestHeader ExpiresActive ExpiresByType ExpiresDefault AddType AddCharset AddEncoding AddLanguage AddDefaultCharset RemoveType AddOutputFilterByType ErrorDocument FileETag
    CGIPassAuth On
    Require all granted
</Directory>

# One vhost per domain, written by the agent (rayxod).
IncludeOptional /etc/apache2/rayxo/*/*.conf
