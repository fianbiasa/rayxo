# rayxo: Apache behind Nginx for customer websites. setup.sh fills in
# the double-brace placeholders and enables this as conf "rayxo".
# Apache only listens on 127.0.0.1:8080 (ports.conf); Nginx in front owns
# ports 80 and 443, serves static files and passes the rest here.

ServerName {{HOSTNAME}}

# These replace Ubuntu's security.conf, which setup.sh disables because it
# loads after this file and would turn them back on.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# The visitor's real address, as Nginx passes it.
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 127.0.0.1 ::1

# HTTPS requests reach Apache over TLS on 127.0.0.1:8444 (below), which
# turns HTTPS on by itself. This also tells PHP during an upgrade, before
# the agent has moved the websites' HTTPS servers there.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

# A customer's .htaccess must never set PHP settings through FastCGI. Even if
# a mod_rewrite "[E=...]" put PHP_VALUE or PHP_ADMIN_VALUE into the request
# environment, strip both before Apache forwards the request to any PHP-FPM
# pool, so open_basedir, auto_prepend_file and the rest stay exactly as the
# pool fixes them. Applied when the request is proxied, after .htaccess ran.
ProxyFCGISetEnvIf "true" !PHP_VALUE
ProxyFCGISetEnvIf "true" !PHP_ADMIN_VALUE

# Customer homes. Symlinks are only followed when the link and its target
# have the same owner, so nobody can link to another account's files.
<Directory /home>
    Options SymLinksIfOwnerMatch
    # A customer's .htaccess may use what real apps, and sites moved here from
    # DirectAdmin or cPanel, need: rewrites and redirects, caching headers,
    # content types and output filters, environment variables, error pages,
    # basic auth. But NOT the directives that route a request to another
    # FastCGI pool (SetHandler, AddHandler, Action, ProxyFCGISetEnvIf): those
    # let a customer's .htaccess run code in the panel's or another account's
    # pool. So FileInfo is replaced by an explicit list of the safe directives;
    # anything else in a .htaccess makes Apache answer 500 for that folder.
    #
    # Environment variables (SetEnv, SetEnvIf, BrowserMatch, like mod_rewrite's
    # [E=]) are safe: the only ones that matter are out of their reach.
    # PHP_VALUE and PHP_ADMIN_VALUE are stripped above, and every vhost forces
    # RAYXO_POOL_OWNER when it proxies, after .htaccess has run. The file()
    # function of Apache expressions (ErrorDocument, Header, <If>) is refused
    # in .htaccess by Apache itself, so Apache cannot be made to read another
    # account's files. The isolation test proves all three.
    AllowOverride AuthConfig Indexes Limit Options=Indexes,MultiViews,SymLinksIfOwnerMatch
    AllowOverrideList \
        RewriteEngine RewriteOptions RewriteBase RewriteCond RewriteRule \
        Redirect RedirectMatch RedirectPermanent RedirectTemp \
        Header RequestHeader ExpiresActive ExpiresByType ExpiresDefault \
        AddType AddCharset AddEncoding AddLanguage AddDefaultCharset \
        RemoveType RemoveCharset RemoveEncoding RemoveLanguage \
        AddOutputFilterByType AddOutputFilter SetOutputFilter RemoveOutputFilter \
        SetEnv UnsetEnv SetEnvIf SetEnvIfNoCase BrowserMatch BrowserMatchNoCase \
        ErrorDocument FileETag
    CGIPassAuth On
    Require all granted
</Directory>

# Nginx sends the requests that came over HTTPS to 127.0.0.1:8444 over TLS,
# so Apache and every .htaccess see HTTPS as the visitor does (%{HTTPS},
# port 443, Apache's own redirects); each website with HTTPS has a vhost
# there. Only Nginx connects, without checking the certificate, so every
# vhost shares this self-signed one (setup.sh makes it). This first vhost
# only answers names no website has, with a refusal.
SSLCertificateFile /etc/apache2/rayxo-backend/cert.pem
SSLCertificateKeyFile /etc/apache2/rayxo-backend/key.pem

<VirtualHost 127.0.0.1:8444>
    ServerName localhost
    SSLEngine on
    <Location />
        Require all denied
    </Location>
</VirtualHost>

# One vhost per domain, written by the agent (rayxod).
IncludeOptional /etc/apache2/rayxo/*/*.conf
