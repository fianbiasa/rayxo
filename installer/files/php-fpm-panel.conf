; rayxo control panel. setup.sh fills in the double-brace placeholders.
; Customer sites never use this pool: each hosting account gets its own.
[rayxo]
user = rayxo
group = rayxo

listen = /run/php/rayxo.sock
; Only Nginx (rayxo-nginx) may reach this socket. The customer Apache runs as
; www-data and is not in this group, so a crafted .htaccess cannot route a
; request here to run code as the panel user.
listen.owner = rayxo-nginx
listen.group = rayxo-nginx
listen.mode = 0660

pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
pm.max_requests = 500

; The panel never runs programs itself: every system change goes through the
; agent (rayxod). Disabling these (including putenv + mail, the LD_PRELOAD
; trick) is defense in depth only. The real boundary is that the panel runs
; as an unprivileged user and the agent only accepts its fixed list of actions.
php_admin_value[disable_functions] = exec,shell_exec,system,passthru,proc_open,popen,pcntl_exec,putenv,mail

; open_basedir holds no directory an account can write to: /tmp is left out on
; purpose. Otherwise an account could route a request to this pool through a
; crafted Apache handler, point it at a file it planted (e.g. in /tmp), and run
; code as the panel user. PHP's own temporary files go to a panel-owned folder.
php_admin_value[open_basedir] = {{INSTALL_DIR}}/:{{DATA_DIR}}/:{{CONFIG_DIR}}/panel.env:/run/rayxo/
php_admin_value[sys_temp_dir] = {{DATA_DIR}}/storage/tmp
php_admin_value[upload_tmp_dir] = {{DATA_DIR}}/storage/tmp
; This pool only ever runs the panel's own .php files.
security.limit_extensions = .php

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 256M
php_admin_value[post_max_size] = 256M
php_admin_flag[log_errors] = on
php_admin_value[error_log] = {{DATA_DIR}}/storage/logs/php-fpm.log
catch_workers_output = yes
